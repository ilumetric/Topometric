<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Everything runs in the browser: requests can only reach this site's own files and local blob:/data: URLs,
       so files never leave the machine. The script hash allows the import map below; update it when the map changes. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-OFXbwOhwNNSKS1rR+l9Mvbk6uMzaCkGoAusy6khZLQE='; img-src 'self' data: blob:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="description" content="Topometric — free local tools for game artists. Everything runs in your browser.">
  <title>Topometric</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="src/styles/base.css">
  <!-- Shared libraries for tools: import * as THREE from 'three' -->
  <script type="importmap">{"imports":{"three":"./src/vendor/three/three.module.js","three/addons/":"./src/vendor/three/addons/"}}</script>
  <script type="module" src="src/app.js"></script>
</head>

<body>
  <script src="src/boot.js"></script>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" /><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" /><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" /></symbol>
    <symbol id="i-matcap" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M7.5 9.5a5 5 0 0 1 4-3.5" /></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 7v6h6" /><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13" /></symbol>
    <symbol id="i-github" viewBox="0 0 24 24"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" /><path d="M9 18c-4.51 2-5-2-7-2" /></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="m7 10 5 5 5-5" /><path d="M12 15V3" /></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="m17 8-5-5-5 5" /><path d="M12 3v12" /></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></symbol>
    <symbol id="i-sidebar" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" /><path d="M9 3v18" /></symbol>
  </svg>

  <!-- ── Sidebar ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <a class="sidebar-brand" href="#" aria-label="Topometric">
        <span class="brand-name brand-full">Topometric</span><span class="brand-name brand-short">T</span>
      </a>
      <button type="button" class="btn btn-icon btn-ghost sidebar-toggle" id="sidebarToggle" aria-controls="sidebar" aria-expanded="true">
        <svg class="icon"><use href="#i-sidebar" /></svg>
      </button>
    </div>

    <nav aria-label="Tools">
      <ul class="sidebar-nav" id="nav"></ul>
    </nav>

    <div class="sidebar-footer">
      <a href="https://github.com/ilumetric/Topometric" target="_blank" rel="noopener" aria-label="GitHub repository">
        <svg class="icon"><use href="#i-github" /></svg>
        <span class="footer-label">GitHub</span>
      </a>
    </div>
  </aside>

  <!-- ── Tool pages are created here on first visit ── -->
  <main class="main" id="main">
    <noscript><p class="page-status">Topometric needs JavaScript to run.</p></noscript>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <span id="toastMsg"></span>
    <button type="button" id="toastAction" class="toast-action" hidden></button>
  </div>
</body>

</html>
